{% extends "base.html" %}{% block title %}{{ page_title }} | StudentDesk{% endblock %}{% block content %}<div class="narrow"><a class="back" href="/students">← Back to students</a><p class="eyebrow">STUDENT RECORD</p><h1>{{ page_title }}</h1><p class="muted">Fill in the academic and contact details.</p><form id="student-form" class="form-card" method="post" action="{{ action }}"><div class="form-grid"><label>Full name *<input id="name" name="name" required maxlength="120" value="{{ student.name if student else '' }}" placeholder="Student full name"></label><label>Roll number *<input id="roll_no" name="roll_no" required maxlength="30" value="{{ student.roll_no if student else '' }}" placeholder="e.g. CST-23001"></label><label>Department *<select name="department" required><option value="">Select department</option>{% for d in departments %}<option value="{{ d }}" {% if student and student.department==d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></label><label>Semester *<select name="semester" required><option value="">Select semester</option>{% for sem in semesters %}<option value="{{ sem }}" {% if student and student.semester==sem %}selected{% endif %}>{{ sem }} Semester</option>{% endfor %}</select></label><label>Email *<input type="email" name="email" required maxlength="150" value="{{ student.email if student else '' }}" placeholder="student@example.com"></label><label>Phone<input type="tel" name="phone" maxlength="30" value="{{ student.phone if student else '' }}" placeholder="01XXXXXXXXX"></label><label>Gender<select name="gender"><option value="">Not specified</option>{% for g in ['Male','Female','Other'] %}<option value="{{ g }}" {% if student and student.gender==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label class="full">Address<textarea name="address" rows="3" maxlength="300" placeholder="Optional address">{{ student.address if student and student.address else '' }}</textarea></label></div><div class="actions"><button class="btn primary" type="submit">{{ button_text }}</button><a class="btn secondary" href="/students">Cancel</a></div></form></div>{% endblock %}
